<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Royale - Classic Board Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Container */
        .game-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .game-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .game-title h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .game-title p {
            font-size: 12px;
            color: #666;
        }

        .rules-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .rules-btn:hover {
            transform: scale(1.05);
        }

        /* Main Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .game-header {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Board Styles */
        .board-wrapper {
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .board {
            aspect-ratio: 1 / 1;
            width: 100%;
            background: #f5e6ca;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            gap: 3px;
            padding: 3px;
            position: relative;
        }

        .cell {
            background: #faf0e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
            cursor: pointer;
        }

        .cell.track {
            background: #ffe4b5;
        }

        .cell.safe {
            background: #ffd700;
            box-shadow: inset 0 0 0 2px #ffaa00;
        }

        .cell.center {
            background: #2d3748;
        }

        .cell.center-core {
            background: #1a202c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Token Styles */
        .token {
            width: 85%;
            height: 85%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 2px solid white;
        }

        .token:hover {
            transform: scale(1.1);
        }

        .token.movable {
            animation: pulse 0.8s infinite;
            box-shadow: 0 0 0 3px #667eea, 0 0 0 6px rgba(102,126,234,0.4);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Side Panel */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        /* Dice Styles */
        .dice-area {
            text-align: center;
        }

        .dice {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.2s;
            border: 3px solid #e0e0e0;
        }

        .dice:hover:not(.disabled) {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .dice.rolling {
            animation: diceShake 0.5s ease-in-out;
        }

        .dice.disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @keyframes diceShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-10deg); }
            75% { transform: translateX(10px) rotate(10deg); }
        }

        .roll-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }

        .roll-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.4);
        }

        .roll-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        /* Player List */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            padding: 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .player-card.active {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-emoji {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .player-name {
            font-weight: bold;
        }

        .player-stats {
            font-size: 12px;
            opacity: 0.8;
        }

        .turn-badge {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            max-width: 500px;
            width: 90%;
            padding: 30px;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .rules-list {
            list-style: none;
            padding: 0;
        }

        .rules-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-modal {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        /* Winner Overlay */
        .winner-overlay {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }

        .winner-overlay h2 {
            color: white;
            font-size: 28px;
        }

        .new-game-btn {
            background: white;
            color: #f59e0b;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Setup Screen */
        .setup-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .setup-card {
            background: white;
            border-radius: 40px;
            max-width: 500px;
            width: 90%;
            padding: 40px;
            text-align: center;
        }

        .setup-card h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .ai-option {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .ai-btn {
            padding: 12px 20px;
            border: 2px solid #667eea;
            background: white;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .ai-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .player-name-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 30px;
            font-size: 16px;
            margin: 20px 0;
            text-align: center;
        }

        .start-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* Utilities */
        .red-bg { background: #ef4444; color: white; }
        .blue-bg { background: #3b82f6; color: white; }
        .green-bg { background: #22c55e; color: white; }
        .yellow-bg { background: #eab308; color: #333; }
        
        .red-soft { background: #fee2e2; }
        .blue-soft { background: #dbeafe; }
        .green-soft { background: #dcfce7; }
        .yellow-soft { background: #fef9c3; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Game Constants
        const COLORS = [
            { name: "Red", bg: "red-bg", soft: "red-soft", emoji: "🔴", textColor: "white" },
            { name: "Blue", bg: "blue-bg", soft: "blue-soft", emoji: "🔵", textColor: "white" },
            { name: "Green", bg: "green-bg", soft: "green-soft", emoji: "🟢", textColor: "white" },
            { name: "Yellow", bg: "yellow-bg", soft: "yellow-soft", emoji: "🟡", textColor: "#333" }
        ];
        
        const TRACK_LENGTH = 40;
        const FINISH_POSITION = 44;
        const CAPTURE_BONUS = 20;
        const SAFE_SQUARES = [0, 8, 10, 18, 20, 28, 30, 38];
        const START_OFFSETS = [0, 10, 20, 30];
        
        // Create track path
        function makeTrack() {
            const cells = [];
            for (let c = 0; c <= 10; c++) cells.push([0, c]);
            for (let r = 1; r <= 10; r++) cells.push([r, 10]);
            for (let c = 9; c >= 0; c--) cells.push([10, c]);
            for (let r = 9; r >= 1; r--) cells.push([r, 0]);
            return cells;
        }
        
        const TRACK = makeTrack();
        
        // Helper functions
        function tokenTrackIndex(playerId, token) {
            if (!token || token.position < 0 || token.position >= TRACK_LENGTH || token.home) return null;
            return (START_OFFSETS[playerId] + token.position) % TRACK_LENGTH;
        }
        
        function tokenCanMove(token, dice) {
            if (!token || !dice || token.home) return false;
            if (token.position === -1) return dice === 6;
            return token.position + dice <= FINISH_POSITION;
        }
        
        function getMovableTokens(player, dice) {
            if (!player || !dice) return [];
            return player.tokens.filter(token => tokenCanMove(token, dice));
        }
        
        function createPlayers(count, names) {
            return Array.from({ length: count }, (_, i) => ({
                id: i,
                name: names[i],
                isAI: i !== 0,
                color: COLORS[i],
                consecutiveSixes: 0,
                tokens: Array.from({ length: 4 }, (_, ti) => ({
                    id: ti,
                    position: -1,
                    home: false
                }))
            }));
        }
        
        function playSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                if (type === 'roll') {
                    [0, 0.08, 0.16, 0.24].forEach((delay, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "sine";
                        osc.frequency.value = 300 + i * 100;
                        gain.gain.value = 0.08;
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + delay);
                        osc.stop(now + delay + 0.1);
                    });
                } else if (type === 'capture') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "square";
                    osc.frequency.value = 440;
                    gain.gain.value = 0.12;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }
        
        // Main Game Component
        class LudoGame {
            constructor(container, onReset) {
                this.container = container;
                this.onReset = onReset;
                this.state = null;
            }
            
            init(players) {
                this.state = {
                    players: players,
                    currentPlayer: 0,
                    diceValue: null,
                    rolling: false,
                    waitingForMove: false,
                    message: "Roll the dice to start!"
                };
                this.render();
                this.startAITurn();
            }
            
            startAITurn() {
                if (!this.state) return;
                const active = this.state.players[this.state.currentPlayer];
                const winner = this.state.players.find(p => p.tokens.every(t => t.home));
                if (winner || !active.isAI) return;
                if (this.state.rolling) return;
                
                setTimeout(() => {
                    if (!this.state.waitingForMove && this.state.diceValue === null) {
                        this.rollDice();
                    } else if (this.state.waitingForMove) {
                        const movable = getMovableTokens(active, this.state.diceValue);
                        if (movable.length > 0) {
                            const tokenToMove = movable.find(t => t.position >= 0) || movable[0];
                            this.moveToken(tokenToMove.id);
                        } else {
                            this.nextTurn();
                        }
                    }
                }, 700);
            }
            
            rollDice() {
                if (this.state.rolling || this.state.waitingForMove) return;
                
                playSound('roll');
                this.state.rolling = true;
                this.render();
                
                setTimeout(() => {
                    const value = Math.floor(Math.random() * 6) + 1;
                    this.state.diceValue = value;
                    const active = this.state.players[this.state.currentPlayer];
                    
                    const newSixCount = value === 6 ? active.consecutiveSixes + 1 : 0;
                    
                    if (newSixCount >= 3) {
                        this.state.players[this.state.currentPlayer].consecutiveSixes = 0;
                        this.state.message = `❌ ${active.name} rolled three 6s! Turn cancelled.`;
                        this.state.rolling = false;
                        this.render();
                        setTimeout(() => this.nextTurn(), 1000);
                        return;
                    }
                    
                    this.state.players[this.state.currentPlayer].consecutiveSixes = newSixCount;
                    const movable = getMovableTokens(this.state.players[this.state.currentPlayer], value);
                    
                    if (movable.length === 0) {
                        this.state.message = `😔 No moves for ${active.name}. Turn ends.`;
                        this.state.rolling = false;
                        this.render();
                        setTimeout(() => this.nextTurn(), 1000);
                    } else {
                        this.state.message = `🎲 ${active.name} rolled ${value}! Choose a token to move.`;
                        this.state.waitingForMove = true;
                        this.state.rolling = false;
                        this.render();
                        this.startAITurn();
                    }
                }, 600);
            }
            
            moveToken(tokenId) {
                if (!this.state.waitingForMove) return;
                
                const active = this.state.players[this.state.currentPlayer];
                const token = active.tokens.find(t => t.id === tokenId);
                if (!tokenCanMove(token, this.state.diceValue)) return;
                
                let captured = false;
                let newPos = token.position === -1 ? 0 : token.position + this.state.diceValue;
                let reachedHome = newPos >= FINISH_POSITION;
                
                // Update token position
                const updatedPlayers = JSON.parse(JSON.stringify(this.state.players));
                const currentPlayerData = updatedPlayers[this.state.currentPlayer];
                const tokenData = currentPlayerData.tokens.find(t => t.id === tokenId);
                tokenData.position = newPos;
                tokenData.home = reachedHome;
                
                // Check for capture
                const landedTrack = newPos < TRACK_LENGTH ? (START_OFFSETS[this.state.currentPlayer] + newPos) % TRACK_LENGTH : null;
                if (landedTrack !== null && !SAFE_SQUARES.includes(landedTrack)) {
                    for (let i = 0; i < updatedPlayers.length; i++) {
                        if (i === this.state.currentPlayer) continue;
                        for (let t of updatedPlayers[i].tokens) {
                            if (tokenTrackIndex(i, t) === landedTrack) {
                                captured = true;
                                t.position = -1;
                                t.home = false;
                            }
                        }
                    }
                }
                
                // Apply capture bonus
                if (captured) {
                    playSound('capture');
                    newPos = Math.min(newPos + CAPTURE_BONUS, FINISH_POSITION);
                    reachedHome = newPos >= FINISH_POSITION;
                    tokenData.position = newPos;
                    tokenData.home = reachedHome;
                }
                
                this.state.players = updatedPlayers;
                this.state.waitingForMove = false;
                
                let extraTurn = this.state.diceValue === 6 || captured || reachedHome;
                let msg = `${active.name} moved ${this.state.diceValue} steps.`;
                if (captured) msg = `⚔️ ${active.name} captured a token! +20 steps and extra turn!`;
                if (reachedHome) msg = `🏠 ${active.name} brought a token HOME! Extra turn!`;
                if (this.state.diceValue === 6 && !captured && !reachedHome) msg = `🎁 ${active.name} rolled a 6! Extra turn!`;
                this.state.message = msg;
                
                this.state.diceValue = null;
                this.render();
                
                if (!extraTurn) {
                    setTimeout(() => this.nextTurn(), 1000);
                } else {
                    setTimeout(() => this.startAITurn(), 500);
                }
            }
            
            nextTurn() {
                this.state.currentPlayer = (this.state.currentPlayer + 1) % this.state.players.length;
                this.state.diceValue = null;
                this.state.waitingForMove = false;
                this.state.message = "";
                this.render();
                this.startAITurn();
            }
            
            renderBoard() {
                const cells = [];
                for (let i = 0; i < 121; i++) {
                    const row = Math.floor(i / 11);
                    const col = i % 11;
                    const trackIndex = TRACK.findIndex(([r, c]) => r === row && c === col);
                    const isTrack = trackIndex !== -1;
                    const isCenter = row >= 4 && row <= 6 && col >= 4 && col <= 6;
                    const isCenterCore = row === 5 && col === 5;
                    const isSafe = SAFE_SQUARES.includes(trackIndex);
                    
                    let cellClass = "cell";
                    if (isCenter) cellClass += " center";
                    if (isTrack && !isCenter) cellClass += " track";
                    if (isSafe && isTrack) cellClass += " safe";
                    if (isCenterCore) cellClass += " center-core";
                    
                    // Get tokens on this cell
                    const tokensHere = [];
                    for (let p of this.state.players) {
                        for (let t of p.tokens) {
                            const trackPos = tokenTrackIndex(p.id, t);
                            if (trackPos === trackIndex) {
                                tokensHere.push({ player: p, token: t });
                            }
                        }
                    }
                    
                    const movableTokens = this.state.waitingForMove ? getMovableTokens(this.state.players[this.state.currentPlayer], this.state.diceValue) : [];
                    const isMovable = (token) => movableTokens.some(mt => mt.id === token.id);
                    const activePlayerId = this.state.currentPlayer;
                    
                    cells.push(`
                        <div class="${cellClass}">
                            ${isCenterCore ? '<span>🏁</span>' : ''}
                            ${isSafe && tokensHere.length === 0 && !isCenterCore ? '<span style="font-size:12px;">★</span>' : ''}
                            ${tokensHere.map(({player, token}) => `
                                <div class="token ${player.color.bg} ${activePlayerId === player.id && isMovable(token) ? 'movable' : ''}"
                                     style="cursor: ${activePlayerId === player.id && !player.isAI && this.state.waitingForMove ? 'pointer' : 'default'}"
                                     onclick="${activePlayerId === player.id && !player.isAI && this.state.waitingForMove ? `window.game.moveToken(${token.id})` : ''}">
                                    ${player.color.emoji}
                                </div>
                            `).join('')}
                        </div>
                    `);
                }
                return cells.join('');
            }
            
            render() {
                const winner = this.state.players.find(p => p.tokens.every(t => t.home));
                const active = this.state.players[this.state.currentPlayer];
                const diceFaces = {1:"⚀",2:"⚁",3:"⚂",4:"⚃",5:"⚄",6:"⚅"};
                
                this.container.innerHTML = `
                    <div class="game-container">
                        <div class="game-header">
                            <div class="game-title">
                                <h1>🎲 Ludo Royale</h1>
                                <p>Classic board game with AI opponents</p>
                            </div>
                            <button class="rules-btn" onclick="document.getElementById('rulesModal').classList.add('show')">📖 Game Rules</button>
                        </div>
                        
                        <div class="main-content">
                            <div class="board-wrapper">
                                <div class="board">
                                    ${this.renderBoard()}
                                </div>
                            </div>
                            
                            <div class="side-panel">
                                <div class="control-card">
                                    <div class="dice-area">
                                        <div class="dice ${this.state.rolling ? 'rolling' : ''} ${(!this.state.waitingForMove && !winner && !active.isAI) ? '' : 'disabled'}" 
                                             onclick="${(!this.state.waitingForMove && !winner && !active.isAI) ? 'window.game.rollDice()' : ''}">
                                            ${this.state.rolling ? '🎲' : (this.state.diceValue ? diceFaces[this.state.diceValue] : '🎲')}
                                        </div>
                                        <button class="roll-btn" 
                                                onclick="window.game.rollDice()"
                                                ${(this.state.waitingForMove || this.state.rolling || winner || active.isAI) ? 'disabled' : ''}>
                                            🎲 Roll Dice
                                        </button>
                                        <div class="message">${this.state.message}</div>
                                    </div>
                                </div>
                                
                                <div class="control-card">
                                    <h3 style="margin-bottom: 15px;">👥 Players</h3>
                                    <div class="players-list">
                                        ${this.state.players.map((p, idx) => `
                                            <div class="player-card ${p.color.soft} ${idx === this.state.currentPlayer && !winner ? 'active' : ''}">
                                                <div class="player-info">
                                                    <div class="player-emoji ${p.color.bg}">${p.color.emoji}</div>
                                                    <div>
                                                        <div class="player-name">${p.name} ${p.isAI ? '🤖' : '👤'}</div>
                                                        <div class="player-stats">🏠 ${p.tokens.filter(t => t.home).length}/4 • 🔒 ${p.tokens.filter(t => t.position === -1).length}</div>
                                                    </div>
                                                </div>
                                                ${idx === this.state.currentPlayer && !winner ? '<div class="turn-badge">Turn</div>' : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                
                                ${winner ? `
                                    <div class="winner-overlay">
                                        <div style="font-size: 50px;">🏆</div>
                                        <h2>${winner.name} Wins!</h2>
                                        <p>All 4 tokens reached home</p>
                                        <button class="new-game-btn" onclick="location.reload()">Play Again</button>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <div id="rulesModal" class="modal">
                        <div class="modal-content">
                            <h2>📜 How to Play Ludo</h2>
                            <ul class="rules-list">
                                <li>🎲 <strong>Roll a 6</strong> to bring a token out of home base</li>
                                <li>⭐ <strong>Star squares</strong> are safe - tokens cannot be captured</li>
                                <li>⚔️ <strong>Capture</strong> opponent by landing on them, sending them home</li>
                                <li>🎁 <strong>Extra turn</strong> for rolling 6 or capturing</li>
                                <li>❌ <strong>Three 6s in a row</strong> cancel your turn</li>
                                <li>🏠 Need <strong>exact number</strong> to enter home column</li>
                                <li>🏆 First to get <strong>all 4 tokens home</strong> wins!</li>
                            </ul>
                            <button class="close-modal" onclick="document.getElementById('rulesModal').classList.remove('show')">Got it!</button>
                        </div>
                    </div>
                `;
                
                window.game = this;
            }
        }
        
        // Setup Screen Component
        class SetupScreen {
            constructor(container, onStart) {
                this.container = container;
                this.onStart = onStart;
                this.aiCount = 3;
                this.playerName = "Player";
                this.render();
            }
            
            render() {
                this.container.innerHTML = `
                    <div class="setup-screen">
                        <div class="setup-card">
                            <h1>🎲 Ludo Royale</h1>
                            <p style="color: #666; margin-bottom: 30px;">Roll, Capture, and Win!</p>
                            
                            <div>
                                <label style="font-weight: bold;">🤖 AI Opponents</label>
                                <div class="ai-option">
                                    ${[1,2,3].map(num => `
                                        <button class="ai-btn ${this.aiCount === num ? 'active' : ''}" data-ai="${num}">${num} AI</button>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <div>
                                <label style="font-weight: bold;">👤 Your Name</label>
                                <input type="text" class="player-name-input" value="${this.playerName}" placeholder="Enter your name">
                            </div>
                            
                            <button class="start-btn">🎮 Start Game</button>
                            
                            <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                                ${COLORS.map(c => `<div style="width: 40px; height: 40px; border-radius: 50%; background: ${c.bg === 'red-bg' ? '#ef4444' : c.bg === 'blue-bg' ? '#3b82f6' : c.bg === 'green-bg' ? '#22c55e' : '#eab308'}; display: flex; align-items: center; justify-content: center;">${c.emoji}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
                
                // Bind events
                const aiBtns = this.container.querySelectorAll('.ai-btn');
                aiBtns.forEach(btn => {
                    btn.onclick = () => {
                        this.aiCount = parseInt(btn.dataset.ai);
                        this.render();
                    };
                });
                
                const nameInput = this.container.querySelector('.player-name-input');
                nameInput.oninput = (e) => this.playerName = e.target.value;
                
                const startBtn = this.container.querySelector('.start-btn');
                startBtn.onclick = () => {
                    const aiNames = ["Dragon", "Phoenix", "Tiger"];
                    const names = [this.playerName, ...aiNames.slice(0, this.aiCount)];
                    this.onStart(createPlayers(this.aiCount + 1, names));
                };
            }
        }
        
        // App Entry
        const appContainer = document.getElementById('app');
        
        function startGame(players) {
            const game = new LudoGame(appContainer, () => {
                const setup = new SetupScreen(appContainer, startGame);
            });
            game.init(players);
        }
        
        const setup = new SetupScreen(appContainer, startGame);
    </script>
</body>
</html>
